name: lod settle faster
# Films far terrain right past the render distance in two builds (tools/demo/lod_seam.py) and
# puts them side by side: fix/lod-near-detail (the seam first, then the coarse backdrop) and
# perf/lod-settle-faster on top of it. Each recording keeps a status timeline (the share of far
# tiles sampled, fps) and every thread's CPU time, and reports when 95% of the tiles were sampled.
# Each build runs offscreen on lavapipe under Xvfb in a new local world. The runner downloads the
# pinned Minecraft from Mojang (tools/demo/minecraft.py), as the Horizon launcher does for a
# player, and prepares resources from it; only the frames' comparison and the games' logs are
# uploaded. The test job runs the far terrain's tests on the faster build.
on:
  push:
    branches: [demo/lod-settle-faster]
  workflow_dispatch:

concurrency:
  group: lod-settle-faster
  cancel-in-progress: true

env:
  BASE_REF: 807fd8b48ab1b5c6e8be041f582230ac675419b0
  FAST_REF: 807fd8b48ab1b5c6e8be041f582230ac675419b0

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: some-du6e/horizon
          ref: ${{ env.FAST_REF }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lod-settle-test
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - run: cargo fmt -p horizon-client-render -p horizon-client -- --check
      - run: cargo clippy -p horizon-client-render --lib --tests --locked -- -D warnings
      - run: cargo test -p horizon-client-render --lib --locked lod

  record:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        side: [base, fast]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: some-du6e/horizon
          ref: ${{ matrix.side == 'base' && env.BASE_REF || env.FAST_REF }}
          path: game
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: game -> target
          shared-key: lod-settle-${{ matrix.side }}
          cache-on-failure: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build headers, Vulkan on the CPU, a virtual screen and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev \
            mesa-vulkan-drivers libvulkan1 vulkan-tools libegl1 libgl1-mesa-dri xvfb xauth ffmpeg \
            libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libx11-xcb1
      - name: Build the game, horizon-ctl and horizon-prepare
        working-directory: game
        run: cargo build --profile fast --locked -p horizon-client --bin horizon-client --bin horizon-ctl -p horizon-prepare --bin horizon-prepare
      - name: The pinned Minecraft, from Mojang
        run: python3 tools/demo/minecraft.py "$RUNNER_TEMP/minecraft"
      - name: Resources prepared from it
        working-directory: game
        run: |
          # Its Java is JAVA_HOME's (setup-java's JDK: the exporters are compiled here).
          target/fast/horizon-prepare --prepare --minecraft-dir "$RUNNER_TEMP/minecraft" \
            --server-jar "$RUNNER_TEMP/minecraft/server.jar" --root "$PWD"
      - name: Vulkan on the CPU (lavapipe)
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES=$icd vulkaninfo --summary
          nproc
      - name: Film the far terrain
        run: |
          version=$(python3 -c "import json; print(json.load(open('game/research-lock.json'))['minecraft']['version'])")
          xvfb-run -a -s "-screen 0 1280x720x24" python3 tools/demo/lod_seam.py record \
            --game game/target/fast/horizon-client --ctl game/target/fast/horizon-ctl \
            --resources "game/.local/horizon-client/$version" --out "$RUNNER_TEMP/${{ matrix.side }}" \
            --at -55 -1910 --height 200 --pitch 20 --seconds 480
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settle-${{ matrix.side }}
          path: ${{ runner.temp }}/${{ matrix.side }}
          if-no-files-found: warn
          retention-days: 3

  compose:
    needs: record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - uses: actions/download-artifact@v4
        with:
          pattern: settle-*
          path: ${{ runner.temp }}
      - name: Side by side
        run: |
          python3 tools/demo/lod_seam.py compose \
            "$RUNNER_TEMP/settle-base" "$RUNNER_TEMP/settle-fast" \
            --labels "fix/lod-near-detail" "perf/lod-settle-faster" --out "$RUNNER_TEMP/compare"
          for side in base fast; do
            cp "$RUNNER_TEMP/settle-$side/status.json" "$RUNNER_TEMP/compare/$side-status.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lod-settle-compare
          path: ${{ runner.temp }}/compare
          retention-days: 14
