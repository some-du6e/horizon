name: screenshot build
# A Linux build of the game and horizon-ctl from any commit, for a pull request's before/after screenshots: run it
# by hand (`gh workflow run screenshot-build.yml --ref <branch> -f ref=<commit>`), or, on a fork whose main doesn't
# have this file yet (GitHub dispatches only workflows on the default branch), push the commit to a
# `screenshot-build/<name>` branch. Download the artifact and drive the game offscreen with horizon-ctl
# (docs/agent-control.md). GitHub's runner only: it holds no secrets, and nothing it builds is published.
on:
  push:
    branches: ['screenshot-build/**']
  workflow_dispatch:
    inputs:
      ref:
        description: The commit or branch to build (empty for the one the run is on)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: screenshot-build
          # Another commit (`ref`) may be anyone's: its build scripts run here, so it never writes the cache that
          # runs of this branch read.
          save-if: ${{ inputs.ref == '' }}
      - name: ALSA and udev headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - name: Build the client and horizon-ctl
        run: cargo build --profile fast --locked -p horizon-client --bin horizon-client -p horizon-client-lib --bin horizon-ctl
      - run: tar czf horizon-screenshot-linux-x86_64.tar.gz -C target/fast horizon-client horizon-ctl
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-screenshot-linux-x86_64
          path: horizon-screenshot-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7
